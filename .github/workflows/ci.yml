name: CI

on:
  pull_request:
    branches: [main]

# Runs the same comparison as register.yml, without committing anything, so
# a PR that changes the script or the allowlist is verified before it lands.
# Needs both HUB_REGISTRY_GH_TOKEN (cross-repo GitHub read) and
# NODE_AUTH_TOKEN (registry read) as repo secrets — if either is unset this
# job fails with a clear message (never silently passes), same as
# register.yml. See README.md "Known gaps".
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: node scripts/generate-register.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_REGISTRY_GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: git diff --stat -- REGISTER.md || true
