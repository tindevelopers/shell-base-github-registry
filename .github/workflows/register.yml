name: Register

on:
  schedule:
    # Daily. Cron is UTC; 07:00 UTC is a quiet hour for every hub's own CI.
    - cron: '0 7 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'hubs.json'
      - 'known-divergences.json'
      - '.github/workflows/register.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      # Cross-repo discovery (step below) and the Konnect signal (this step)
      # both need read access to repos OTHER than this one. The default,
      # automatically-issued `secrets.GITHUB_TOKEN` is scoped to only the
      # repo the workflow runs in and cannot read them — confirmed by run
      # https://github.com/tindevelopers/shell-base-github-registry/actions/runs/35930411784,
      # which failed with "GitHub API /repos/tindevelopers/shell-base-admin/
      # contents/packages: Not Found" using that default token. HUB_REGISTRY_
      # GH_TOKEN is a classic or fine-grained PAT with read access to every
      # repo in hubs.json plus konnect-caas-base. Until it's added (Settings
      # → Secrets and variables → Actions), the Konnect step below is
      # skipped (not failed) and the "Generate register" step fails at
      # discovery — see README.md "Known gap: HUB_REGISTRY_GH_TOKEN".
      - name: Fetch Konnect pin-check signal (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HUB_REGISTRY_GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HUB_REGISTRY_GH_TOKEN not set — skipping (see README.md 'Konnect signal')."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/tindevelopers/konnect-caas-base.git" /tmp/konnect-caas-base
          cd /tmp/konnect-caas-base
          node scripts/check-hub-package-pins.mjs > "$GITHUB_WORKSPACE/konnect-pin-check.txt" 2>&1 || true

      - name: Install
        run: pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # The core comparison. Fails the job on an unexplained backward
      # divergence (registry latest ahead of a package's default branch) —
      # see scripts/generate-register.mjs for the full classification.
      - name: Generate register
        id: generate
        run: node scripts/generate-register.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_REGISTRY_GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # Commit REGISTER.md straight to main — this repo holds no source code
      # to review, only a generated report, so a daily PR-per-run would be
      # pure noise. A real reviewable diff still happens for any change to
      # the script or the allowlist, via the push-triggered run above and
      # ordinary PRs against those files (see README.md "How this runs").
      # Runs even when the comparison above found (and failed on) an
      # unexplained divergence, so the committed REGISTER.md always reflects
      # what this run actually found — never only the runs that passed.
      - name: Commit updated REGISTER.md
        if: always() && steps.generate.outcome != 'skipped'
        run: |
          rm -f konnect-pin-check.txt
          if git diff --quiet -- REGISTER.md; then
            echo "REGISTER.md unchanged."
            exit 0
          fi
          git config user.name "hub-registry-bot"
          git config user.email "hub-registry-bot@users.noreply.github.com"
          git add REGISTER.md
          git commit -m "chore: update REGISTER.md ($(date -u +%Y-%m-%d))"
          git push
